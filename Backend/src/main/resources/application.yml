spring:
  profiles:
    active: dev

  application:
    name: rag-chatbot-backend

  servlet:
    multipart:
      max-file-size: 50MB      # Giới hạn file upload
      max-request-size: 50MB
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

# gemini:
#   api-key: GEMINI_API_KEY_PLACEHOLDER
groq:
  api-key: ${GROQ_API_KEY}
app:
  upload-dir: ./uploads
  preprocessing:
    cleaner:
      enable-noise-removal: true
      enable-line-unbreak: true
      enable-whitespace-normalization: true
      line-join-separator: " "
      noise-regex:
        - "(?i)^page\\s+\\d+(\\s+of\\s+\\d+)?$"
        - "(?i)^confidential$"
        - "(?i)^draft$"

logging:
  level:
    KLTN.RAG_CHATBOT_BE.service.DocumentParserService: DEBUG
    KLTN.RAG_CHATBOT_BE.service.ChunkingService2: DEBUG