spring:
  profiles:
    active: dev

  application:
    name: rag-chatbot-backend

  servlet:
    multipart:
      max-file-size: 50MB      # Giới hạn file upload
      max-request-size: 50MB
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

# gemini:
#   api-key: GEMINI_API_KEY_PLACEHOLDER
groq:
  api-key: ${GROQ_API_KEY}
rag:
  retrieval:
    vector-anchor-k: 30
    hybrid:
      enabled: true
      keyword-top-m: 30
      max-keyword-scan-chunks: 3000
      vector-weight: 0.35
      keyword-weight: 0.35
      rerank-weight: 0.30
      exact-match-boost: 2.0
      phrase-match-boost: 1.5
      table-row-boost: 1.2
      table-summary-boost: 0.8
    prompt-budget:
      enabled: true
      fact-context-char-budget: 10000
      table-context-char-budget: 14000
      list-context-char-budget: 16000
      hard-max-context-char-budget: 18000

app:
  upload-dir: ./uploads
  preprocessing:
    cleaner:
      enable-noise-removal: true
      enable-line-unbreak: true
      enable-whitespace-normalization: true
      line-join-separator: " "
      noise-regex:
        - "(?i)^page\\s+\\d+(\\s+of\\s+\\d+)?$"
        - "(?i)^confidential$"
        - "(?i)^draft$"

logging:
  level:
    KLTN.RAG_CHATBOT_BE.ingest.parser.DocumentParserService: DEBUG
    KLTN.RAG_CHATBOT_BE.ingest.chunking.ChunkingService2: DEBUG