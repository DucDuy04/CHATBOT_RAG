spring:
  datasource:
    url: jdbc:mysql://mysql:3306/ragchatbot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 0406

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

qdrant:
  host: qdrant
  port: 6334
  http-port: 6333
  url: http://qdrant:6333
  collection-name: documents
  vector-size: 768

groq:
  api-key: ${GROQ_API_KEY}
  chat-model: llama-3.3-70b-versatile
  base-url: https://api.groq.com/openai/v1
  fallback-models: "llama-3.1-8b-instant,meta-llama/llama-4-scout-17b-16e-instruct,qwen/qwen3-32b"

nomic:
  api-key: ${NOMIC_API_KEY}
  embedding-model: nomic-embed-text-v1.5

cohere:
  api-key: ${COHERE_API_KEY:}
  rerank:
    enabled: ${COHERE_RERANK_ENABLED:false}
    model: rerank-multilingual-v3.0

app:
  upload-dir: ./uploads

server:
  port: 8080

logging:
  level:
    # Bật debug để thấy log parse/chunk trong docker logs
    KLTN.RAG_CHATBOT_BE.service.DocumentParserService: DEBUG
    KLTN.RAG_CHATBOT_BE.service.ChunkingService2: DEBUG
    KLTN.RAG_CHATBOT_BE.service.RerankService: DEBUG