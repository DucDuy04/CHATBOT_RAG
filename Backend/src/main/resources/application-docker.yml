spring:
  datasource:
    url: jdbc:mysql://mysql:3306/ragchatbot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

qdrant:
  host: qdrant
  http-port: 6333
  collection-name: documents
  vector-size: 768

groq:
  api-key: ${GROQ_API_KEY}
  chat-model: meta-llama/llama-4-scout-17b-16e-instruct
  base-url: https://api.groq.com/openai/v1
  fallback-models: "llama-3.3-70b-versatile,openai/gpt-oss-20b"

nomic:
  api-key: ${NOMIC_API_KEY}
  embedding-model: nomic-embed-text-v1.5

cohere:
  api-key: ${COHERE_API_KEY:}
  rerank:
    enabled: ${COHERE_RERANK_ENABLED:false}
    model: rerank-multilingual-v3.0

app:
  upload-dir: ./uploads

server:
  port: 8080

logging:
  level:
    # Bật debug để thấy log parse/chunk trong docker logs
    KLTN.RAG_CHATBOT_BE.ingest.parser.DocumentParserService: DEBUG
    KLTN.RAG_CHATBOT_BE.ingest.chunking.ChunkingService2: DEBUG
    KLTN.RAG_CHATBOT_BE.rag.rerank.RerankService: DEBUG