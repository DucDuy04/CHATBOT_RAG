spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ragchatbot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-init-sql: SET NAMES utf8mb4

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
# Cấu hình Qdrant
qdrant:
  host: localhost
  port: 6334                    # Dùng cổng gRPC
  http-port: 6333               # Dùng cổng HTTP cho REST API
  collection-name: documents
  vector-size: 768             # gemini-embedding-001 = 3072 dimensions

# Cấu hình Gemini
# gemini:
#   api-key: GEMINI_API_KEY_PLACEHOLDER
#   embedding-model: gemini-embedding-001
#   chat-model: gemini-2.0-flash-lite

# Cấu hình Groq
groq:
  api-key: ${GROQ_API_KEY}
  chat-model: llama-3.3-70b-versatile   # Model chính (100k TPD)
  base-url: https://api.groq.com/openai/v1
  # Danh sách model fallback khi model chính bị rate limit.
  # Mỗi model Groq có quota TPD riêng biệt.
  # Thứ tự: thử lần lượt từ trên xuống.
  # Dùng comma-separated string thay vì YAML list để @Value inject đúng
  # gemma2-9b-it đã bị Groq decommission — dùng llama-4-scout và qwen3 thay thế
  fallback-models: "llama-3.1-8b-instant,meta-llama/llama-4-scout-17b-16e-instruct,qwen/qwen3-32b"

nomic:
  api-key: ${NOMIC_API_KEY}
  embedding-model: nomic-embed-text-v1.5

# Thư mục lưu file upload
app:
  upload-dir: ./uploads

server:
  port: 8080





