# docker-compose.yml
services:

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: on-failure
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NOMIC_API_KEY=${NOMIC_API_KEY}
      - MYSQL_ROOT_PASSWORD=root

  mysql:
    image: mysql:8.0
    container_name: ragchatbot-mysql
    environment:
      MYSQL_DATABASE: ragchatbot
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragchatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data: