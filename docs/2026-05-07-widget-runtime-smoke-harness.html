<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget Runtime Smoke Harness</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px;
      }
      .panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      label {
        font-size: 14px;
        font-weight: 600;
      }
      select,
      input,
      button {
        font-size: 14px;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      button {
        background: #0f172a;
        color: #ffffff;
        border: none;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.92;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
        font-size: 12px;
      }
      .hint {
        font-size: 13px;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h2>Widget Runtime Smoke Harness</h2>
        <p class="hint">
          Use this page to apply each Prompt 12B config case, then visually verify bubble/frame position, color, icon, and welcome message.
        </p>
      </div>

      <div class="panel">
        <div class="row">
          <label for="caseSelect">Smoke case</label>
          <select id="caseSelect"></select>
          <label for="scriptSrc">Widget script URL</label>
          <input id="scriptSrc" type="text" value="http://localhost:5173/dist-widget/chatbot-widget.iife.js" style="min-width: 360px;" />
          <button id="applyBtn" type="button">Apply Case</button>
          <button id="removeBtn" type="button">Remove Widget</button>
        </div>
      </div>

      <div class="panel">
        <h3>Current window.RagChatbotConfig</h3>
        <pre id="configPreview"></pre>
      </div>
    </div>

    <script>
      const CASES = [
        {
          id: "case-1-default-right",
          name: "Case 1 - bottom-right default",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
            position: "bottom-right",
            widgetColor: "#2563eb",
            welcomeMessage: "Xin chào từ smoke test!",
            launcherIcon: "chat",
          },
        },
        {
          id: "case-2-bottom-left",
          name: "Case 2 - bottom-left",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
            position: "bottom-left",
            widgetColor: "#2563eb",
            welcomeMessage: "Xin chào từ smoke test bên trái!",
            launcherIcon: "chat",
          },
        },
        {
          id: "case-3-custom-color",
          name: "Case 3 - custom color",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
            position: "bottom-right",
            widgetColor: "#dc2626",
            welcomeMessage: "Widget màu đỏ",
            launcherIcon: "chat",
          },
        },
        {
          id: "case-4-vietnamese-welcome",
          name: "Case 4 - custom welcome message",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
            position: "bottom-right",
            widgetColor: "#16a34a",
            welcomeMessage: "Xin chào! Tôi là trợ lý AI cho website thử nghiệm. Bạn cần hỗ trợ gì hôm nay?",
            launcherIcon: "chat",
          },
        },
        {
          id: "case-5-help-icon",
          name: "Case 5 - launcher icon help",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
            position: "bottom-right",
            widgetColor: "#7c3aed",
            welcomeMessage: "Bạn cần trợ giúp?",
            launcherIcon: "help",
          },
        },
        {
          id: "case-6-spark-icon",
          name: "Case 6 - launcher icon spark",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
            position: "bottom-right",
            widgetColor: "#f59e0b",
            welcomeMessage: "Trợ lý AI sẵn sàng hỗ trợ.",
            launcherIcon: "spark",
          },
        },
        {
          id: "case-7-invalid-fallback",
          name: "Case 7 - missing/invalid fallback",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
            position: "bad-position",
            widgetColor: "not-a-color",
            welcomeMessage: "",
            launcherIcon: "bad-icon",
          },
        },
        {
          id: "case-8-missing-optional",
          name: "Case 8 - missing optional fields",
          config: {
            widgetKey: "test-key",
            frontendUrl: "http://localhost:5173",
          },
        },
      ];

      const caseSelect = document.getElementById("caseSelect");
      const configPreview = document.getElementById("configPreview");
      const scriptSrcInput = document.getElementById("scriptSrc");

      CASES.forEach((item, index) => {
        const opt = document.createElement("option");
        opt.value = String(index);
        opt.textContent = item.name;
        caseSelect.appendChild(opt);
      });

      function removeWidgetDom() {
        const bubble = document.getElementById("rag-chatbot-bubble");
        if (bubble) bubble.remove();
        const frame = document.getElementById("rag-chatbot-frame");
        if (frame) frame.remove();
        const script = document.getElementById("smoke-widget-script");
        if (script) script.remove();
      }

      function applyCase() {
        const index = Number(caseSelect.value || "0");
        const selected = CASES[index];
        window.RagChatbotConfig = { ...selected.config };
        configPreview.textContent = JSON.stringify(window.RagChatbotConfig, null, 2);

        removeWidgetDom();

        const script = document.createElement("script");
        script.id = "smoke-widget-script";
        script.async = true;
        script.src = scriptSrcInput.value.trim();
        document.body.appendChild(script);
      }

      document.getElementById("applyBtn").addEventListener("click", applyCase);
      document.getElementById("removeBtn").addEventListener("click", removeWidgetDom);

      // Auto-apply first case for convenience
      caseSelect.value = "0";
      applyCase();
    </script>
  </body>
</html>
